<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">

<th:block layout:fragment="pagetitle">
	<!--page title-->
	<div th:replace="partials/title-meta :: title-meta('Editor Analytics')"></div>
</th:block>

<head>
	<!-- gridjs css -->
	<link rel="stylesheet" href="/assets/libs/gridjs/theme/mermaid.min.css">
</head>

<body>
	<div layout:fragment="content">
		<!-- start page title -->
		<div th:replace="partials/page-title :: page-title('داشبورد','آمار و تحلیل سردبیر')"></div>
		<!-- end page title -->

		<!-- Personal Stats Cards -->
		<div class="row">
			<div class="col-xl-3 col-md-6">
				<div class="card card-animate">
					<div class="card-body">
						<div class="d-flex align-items-center">
							<div class="flex-grow-1 overflow-hidden">
								<p class="text-uppercase fw-medium text-muted text-truncate mb-0">اخبار من اضافه شده</p>
								<h4 class="fs-22 fw-semibold ff-secondary mb-4">
									<span class="counter-value" th:data-target="${totalNewsAdded}" data-target="125">0</span>
								</h4>
							</div>
							<div class="flex-shrink-0">
								<div id="my_news_sparkline" data-colors='["--vz-primary"]' class="apex-charts" dir="ltr"></div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-xl-3 col-md-6">
				<div class="card card-animate">
					<div class="card-body">
						<div class="d-flex align-items-center">
							<div class="flex-grow-1 overflow-hidden">
								<p class="text-uppercase fw-medium text-muted text-truncate mb-0">ویرایش‌های من</p>
								<h4 class="fs-22 fw-semibold ff-secondary mb-4">
									<span class="counter-value" th:data-target="${totalEdits}" data-target="89">0</span>
								</h4>
							</div>
							<div class="flex-shrink-0">
								<div id="my_edits_sparkline" data-colors='["--vz-success"]' class="apex-charts" dir="ltr"></div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-xl-3 col-md-6">
				<div class="card card-animate">
					<div class="card-body">
						<div class="d-flex align-items-center">
							<div class="flex-grow-1 overflow-hidden">
								<p class="text-uppercase fw-medium text-muted text-truncate mb-0">درصد استفاده من از چپ چین</p>
								<h4 class="fs-22 fw-semibold ff-secondary mb-4">
									<span class="counter-value" th:data-target="${aiAssistancePercentage}" data-target="42">0</span>%
								</h4>
							</div>
							<div class="flex-shrink-0">
								<div id="my_ai_usage_sparkline" data-colors='["--vz-info"]' class="apex-charts" dir="ltr"></div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-xl-3 col-md-6">
				<div class="card card-animate">
					<div class="card-body">
						<div class="d-flex align-items-center">
							<div class="flex-grow-1 overflow-hidden">
								<p class="text-uppercase fw-medium text-muted text-truncate mb-0">میانگین امتیاز خبرنگار</p>
								<h4 class="fs-22 fw-semibold ff-secondary mb-4">
									<span class="counter-value" th:data-target="${avgSeoScore}" data-target="78">0</span>
								</h4>
							</div>
							<div class="flex-shrink-0">
								<div id="my_seo_score_sparkline" data-colors='["--vz-warning"]' class="apex-charts" dir="ltr"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Charts Row -->
		<div class="row">
			<!-- Weekly Activity Chart -->
			<div class="col-xl-8">
				<div class="card">
					<div class="card-header">
						<h4 class="card-title mb-0">فعالیت هفتگی من</h4>
					</div>
					<div class="card-body">
						<div id="weekly_activity_chart" data-colors='["--vz-primary", "--vz-success", "--vz-info"]' class="apex-charts" dir="ltr"></div>
					</div>
				</div>
			</div>

			<!-- Performance Summary -->
			<div class="col-xl-4">
				<div class="card">
					<div class="card-header">
						<h4 class="card-title mb-0">خلاصه عملکرد</h4>
					</div>
					<div class="card-body">
						<div id="performance_donut_chart" data-colors='["--vz-primary", "--vz-success", "--vz-warning"]' class="apex-charts" dir="ltr"></div>
						
						<div class="mt-3">
							<div class="d-flex justify-content-between align-items-center border-bottom py-2">
								<span class="text-muted">اخبار اضافه شده</span>
								<span class="fw-medium" id="news-percentage">58.5%</span>
							</div>
							<div class="d-flex justify-content-between align-items-center border-bottom py-2">
								<span class="text-muted">ویرایش‌ها</span>
								<span class="fw-medium" id="edits-percentage">31.2%</span>
							</div>
							<div class="d-flex justify-content-between align-items-center py-2">
								<span class="text-muted">استفاده از AI</span>
								<span class="fw-medium" id="ai-percentage">10.3%</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Recent Actions Table -->
		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-header">
						<h4 class="card-title mb-0">آخرین فعالیت من</h4>
					</div>
					<div class="card-body">
						<div id="recent-actions-table"></div>
					</div>
				</div>
			</div>
		</div>

	</div>

	<th:block layout:fragment="pagejs">
		<!-- apexcharts -->
		<script src="/assets/libs/apexcharts/apexcharts.min.js"></script>
		<!-- gridjs js -->
		<script src="/assets/libs/gridjs/gridjs.umd.js"></script>
		<!-- Editor Analytics init -->
		<script src="/assets/js/pages/editor-analytics.init.js"></script>
		
		<!-- Initialize with real data from backend -->
		<script th:inline="javascript">
		document.addEventListener('DOMContentLoaded', function() {
			// Prepare backend data for JavaScript
			var backendData = {
				totalNewsAdded: /*[[${totalNewsAdded}]]*/ 0,
				totalEdits: /*[[${totalEdits}]]*/ 0,
				totalAIAssisted: /*[[${totalAIAssisted}]]*/ 0,
				aiAssistancePercentage: /*[[${aiAssistancePercentage}]]*/ 0,
				avgSeoScore: /*[[${avgSeoScore}]]*/ 0,
				recentSeoScores: /*[[${recentSeoScores}]]*/ [],
				chartData: {
					labels: /*[[${chartData.monthLabels}]]*/ [],
					newsCountData: /*[[${chartData.newsCountData}]]*/ [],
					seoScoreData: /*[[${chartData.seoScoreData}]]*/ [],
					editsCountData: /*[[${chartData.editsCountData}]]*/ [],
					aiUsageData: /*[[${chartData.aiUsageData}]]*/ []
				},
				weeklyData: {
					weekLabels: /*[[${chartData.weekLabels}]]*/ [],
					weeklyNewsData: /*[[${chartData.weeklyNewsData}]]*/ [],
					weeklyEditsData: /*[[${chartData.weeklyEditsData}]]*/ [],
					weeklyChapChinData: /*[[${chartData.weeklyChapChinData}]]*/ [],
					weeklySeoData: /*[[${chartData.weeklySeoData}]]*/ []
				},
				recentNews: /*[[${recentNewsSimple}]]*/ []
			};
			
			// Initialize analytics with real data
			if (typeof initializeEditorAnalytics === 'function') {
				initializeEditorAnalytics(backendData);
			}
		});
		</script>
	</th:block>
</body>

</html>
