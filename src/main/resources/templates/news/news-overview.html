<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="pagetitle">
    <!--page title-->
    <div th:replace="partials/title-meta :: title-meta(' مشاهده خبر')"></div>
</th:block>

<head>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="/assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/assets/libs/filepond/filepond.min.css" type="text/css" />
    <link rel="stylesheet" href="/assets/libs/filepond-plugin-image-preview/filepond-plugin-image-preview.min.css">
    <link rel="stylesheet" href="/assets/css/news-overview.css" type="text/css">
</head>

<body>
<div layout:fragment="content">
    <div th:replace="partials/page-title :: page-title('خبرها','مشاهده خبر')"></div>

    <div class="row justify-content-center no-page">
        <div class="col-xxl-10">

            <!-- ============================== خبر ============================== -->
            <div class="card no-card">

                <div class="no-header">
                    <p th:text="${news.headline}" class="no-kicker"></p>
                    <h1 th:text="${news.title}" class="no-title"></h1>
                    <p th:text="${news.subTitle}" class="no-subtitle"></p>

                    <div class="no-tags">
                        <span th:each="item : ${news.tags}" th:text="${item.name}" class="no-tag"></span>
                    </div>

                    <div class="no-meta">
                        <img th:src="${userProfile.profilePhoto}" alt="" class="no-meta-avatar">
                        <div class="no-meta-text">
                            <h6 th:text="${news.userId.email}" class="no-meta-name"></h6>
                            <p class="no-meta-sub">
                                <span th:text="${news.userId.userTypeId.userTypeName == 'Admin' ? 'ادمین' : 'کاربر'}" class="no-meta-role"></span>
                                <span class="no-meta-dot"></span>
                                <span id="persian-date" th:data-date="${news.createdAt}"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="no-cover">
                    <img th:src="@{'/news/photos/'+ ${news.mainImage}}" alt="">
                </div>

                <div class="no-body" th:utext="${news.body}"></div>
            </div>

            <!-- ============================= نظرات ============================= -->
            <div th:if="${!#authorization.expression('hasAuthority(''Ai'')')}">
                <div class="card no-card">
                    <div class="no-comments-head">
                        <span class="no-comments-icon"><i class="ri-chat-3-line"></i></span>
                        <h5 class="no-comments-title">نظرات</h5>
                    </div>

                    <div class="card-body">
                        <div class="no-comments-list">
                            <div th:each="comment : ${news.comments}" th:if="${comment.status}" class="no-comment">
                                <span class="no-comment-avatar"><i class="ri-user-3-line"></i></span>
                                <div class="no-comment-body">
                                    <div class="no-comment-head">
                                        <h6 th:text="${comment.name}" class="no-comment-name"></h6>
                                        <small class="persian-date-comment no-comment-date" th:data-date-comment="${comment.createdAt}"></small>
                                    </div>
                                    <p th:text="${comment.content}" class="no-comment-text"></p>
                                </div>
                            </div>
                        </div>

                        <!-- shown by CSS when the list above renders no .no-comment rows -->
                        <div class="no-comments-empty">
                            <i class="ri-chat-off-line"></i>
                            هنوز نظری ثبت نشده است.
                        </div>

                        <form th:object="${comment}" th:action="@{/admin/comments/save/{id}(id=${news.id})}" method="post" class="no-form">
                            <h6 class="no-form-title"><i class="ri-chat-new-line"></i> ثبت نظر جدید</h6>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="inputName" class="form-label no-label">نام و نام خانوادگی</label>
                                    <input class="form-control" th:field="*{name}" id="inputName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="inputEmail" class="form-label no-label">ایمیل</label>
                                    <input class="form-control" th:field="*{email}" id="inputEmail" dir="ltr" required>
                                </div>
                                <div class="col-12">
                                    <label for="exampleFormControlTextarea1" class="form-label no-label">نظر خود را بنویسید</label>
                                    <textarea class="form-control" th:field="*{content}" id="exampleFormControlTextarea1" rows="4" required></textarea>
                                </div>
                                <div class="col-12 text-end">
                                    <button type="submit" class="btn btn-success">
                                        <i class="ri-send-plane-line"></i> ارسال نظر
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>



<th:block layout:fragment="pagejs">
    <script src="/assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="/assets/js/pages/sweetalerts.init.js"></script>
    <script src="/assets/libs/prismjs/prism.js"></script>
    <script src="/assets/js/crawler/news-overview.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var success = [[${success}]];
        if (success === true) {
            Swal.fire({
                text: "نظر شما با موفقیت ذخیره شد. و پس از تایید منتشر می شود.",
                icon: "success",
                confirmButtonText: "تایید",
                confirmButtonColor: "#556ee6"
            });
        }
        /*]]>*/

    </script>
</th:block>
</body>

</html>
