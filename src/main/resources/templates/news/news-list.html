<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="pagetitle">
    <!--page title-->
    <div th:replace="partials/title-meta :: title-meta('لیست خبرها')"></div>
</th:block>

<head>
    <!-- Sweet Alert css-->
    <link href="/assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.2.2/css/buttons.dataTables.min.css">
</head>

<body>
<div layout:fragment="content">
    <div th:replace="partials/page-title :: page-title('اخبار','لیست خبرها')"></div>

    <div class="row">
        <div class="col-lg-12">
            <div class="card" id="tasksList">
                <div class="card-header border-0">
                    <div class="d-flex align-items-center">
                        <h5 class="card-title mb-0 flex-grow-1">کل خبرها</h5>
                    </div>
                    <div class="card ribbon-box border bg-soft-primary shadow-none mt-2 mb-lg-0">
                        <div class="card-body">
                            <div class="ribbon ribbon-primary round-shape">فیلتر</div>
                            <h5 class="fs-14 text-end"></h5>
                            <div class="ribbon-content mt-4 text-muted">
                                <div class="row mt-2">
                                    <div class="col-xxl-3 col-sm-4">
                                        <div class="input-light">
                                            <label for="status-filter" class="form-label">فیلتر بر اساس وضعیت:</label>
                                            <select class="form-control" data-choices data-choices-search-false name="status" id="status-filter">
                                                <option value="" selected>وضیعت</option>
                                                <option value="Draft">پیش نویس</option>
                                                <option value="Publish">منتشرشده</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-xxl-3 col-sm-4">
                                        <div class="input-light">
                                            <label for="idNewsType" class="form-label">فیلتر بر اساس نوع خبر:</label>
                                            <select class="form-control" data-choices data-choices-search-false name="newsType" id="idNewsType">
                                                <option value="" selected>نوع خبر</option>
                                                <option value="Video">ویدئویی</option>
                                                <option value="Default">استاندارد</option>
                                                <option value="Image">گالری</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-xxl-3 col-sm-4">
                                        <div class="input-light">
                                            <label for="idUser" class="form-label">فیلتر بر اساس نویسنده:</label>
                                            <select class="form-control" data-choices data-choices-search-false name="newsType" id="idUser">
                                                <option value="" selected>همه</option>
                                                <option th:each="user : ${userNames}" th:value="${user.email}" th:text="${user.email}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-xxl-3 col-sm-4">
                                        <div class="input-light">
                                            <label for="idFilter" class="form-label">فیلتر بر اساس کد اخبار:</label>
                                            <input type="text" class="form-control" name="idFilter" id="idFilter" placeholder="شناسه اخبار">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <table id="news-datatables" class="table table-bordered nowrap table-striped align-middle table-responsive" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>کدخبر</th>
                                        <th>تیتر</th>
                                        <th>نوع خبر</th>
                                        <th>نویسنده</th>
                                        <th>روز انتشار</th>
                                        <th>وضیعت</th>
                                        <th>دسته بندی</th>
                                        <th>عملیات</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<th:block layout:fragment="modal">

</th:block>

<th:block layout:fragment="pagejs">
    <script src="/assets/libs/list.js/list.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="/assets/libs/prismjs/prism.js"></script>
    <script src="/assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="/assets/libs/flatpickr/flatpickr.min.js"></script>
    <script src="/assets/libs/flatpickr/flatpickr.min.css"></script>
    <script src="/assets/js/crawler/news-list.js"></script>
    <script>
        function confirmDelete(event) {
            event.preventDefault();
            const form = event.target.closest('form');

            Swal.fire({
                title: 'آیا مطمئن هستید؟',
                text: 'این عمل قابل بازگشت نیست!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'بله، حذف کن',
                cancelButtonText: 'لغو',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        }
    </script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var success = [[${notFound}]];
        if (success === true) {
            Swal.fire({
                text: "خبری با فیلتر های شما یافت نشد.",
                icon: "info",
                confirmButtonText: "تایید",
                confirmButtonColor: "#556ee6"
            });
        }
        /*]]>*/


        /*<![CDATA[*/
        var deleted = [[${deleted}]];
        if (deleted === true) {
            Swal.fire({
                text: "خبر شما با موفقیت حذف شد.",
                icon: "success",
                confirmButtonText: "تایید",
                confirmButtonColor: "#556ee6"
            });
        }
        /*]]>*/
    </script>

</th:block>
</body>

</html>
