<head>

<body>

<div th:replace="~{zolal/partials/site-icons :: icons}"></div>

<div th:replace="~{zolal/partials/site-header :: header(${activeNav})}"></div>

<main layout:fragment="main" id="main" tabindex="-1"></main>

<div th:replace="~{zolal/partials/site-footer :: footer}"></div>

<script src="/assets/zolal/js/site.js" defer></script>

</html>
