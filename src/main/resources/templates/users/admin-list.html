<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<th:block layout:fragment="pagetitle">
    <div th:replace="partials/title-meta :: title-meta('ادمین‌ها')"></div>
</th:block>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Added for responsiveness -->
    <link href="/assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.2.2/css/buttons.dataTables.min.css">
</head>

<body>
<div layout:fragment="content">
    <div th:replace="partials/page-title :: page-title('ادمین‌ها','فروشگاه')"></div>

    <div class="row">
        <div class="col-lg-12">
            <div>
                <div class="card">
                    <div class="card-header border-0">
                        <div class="row g-4 align-items-center">
                            <div class="col">
                                <h5 class="card-title mb-0">لیست ادمین‌ها</h5>
                            </div>
                            <div class="col-auto ms-auto">
                                <a href="/admin/signup/4f8e3bc28e934dc29b97f3ae9f25a7e1" class="btn btn-primary">افزودن ادمین</a>
                            </div>
                        </div>

                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                                <div class="table-responsive">
                                    <table id="customers-datatables" class="table table-bordered nowrap table-striped align-middle table-responsive" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>کد ادمین‌</th>
                                            <th>ایمیل</th>
                                            <th>وضیعت</th>
                                            <th>تاریخ ساخت اکانت</th>
                                            <th>تاریخ آخرین تغییر اکانت</th>
                                            <th>عملیات</th>
                                        </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div> <!-- /.card-body -->
                </div> <!-- /.card -->
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="modal">
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="editUserForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editUserModalLabel">ویرایش کاربر</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit-user-id" name="id">

                        <div class="mb-3">
                            <label for="edit-email" class="form-label">ایمیل</label>
                            <input type="email" class="form-control" id="edit-email" name="email">
                        </div>

                        <div class="mb-3">
                            <label for="edit-password" class="form-label">رمز عبور (در صورت نیاز)</label>
                            <input type="password" class="form-control" id="edit-password" name="password">
                        </div>

                        <div class="mb-3">
                            <label for="edit-status" class="form-label">وضعیت</label>
                            <select class="form-select" id="edit-status" name="active">
                                <option value="true">فعال</option>
                                <option value="false">غیرفعال</option>
                            </select>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">بستن</button>
                        <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</th:block>

<th:block layout:fragment="pagejs">
    <script src="/assets/libs/list.js/list.min.js"></script>
    <script src="/assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="/assets/js/pages/sweetalerts.init.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="/assets/libs/prismjs/prism.js"></script>
    <script src="/assets/js/crawler/admins-list.js"></script>
</th:block>
</body>

</html>
