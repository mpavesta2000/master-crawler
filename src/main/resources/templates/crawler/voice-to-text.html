<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<th:block layout:fragment="pagetitle">
    <div th:replace="partials/title-meta :: title-meta('تبدیل صدا به متن')"></div>
</th:block>

<head>
    <link href="/assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/assets/libs/filepond/filepond.min.css" type="text/css" />
    <link rel="stylesheet" href="/assets/libs/filepond-plugin-image-preview/filepond-plugin-image-preview.min.css">
    <link rel="stylesheet" href="/assets/css/voice-to-text.css" type="text/css">
</head>

<body>
<div layout:fragment="content">
    <div th:replace="partials/page-title :: page-title('ابزار هوش مصنوعی','تبدیل صدا به متن')"></div>

    <div class="row vtt-page">

        <!-- ======================= ستون راست: ورودی صدا ======================= -->
        <div class="col-xl-5">

            <!-- ضبط صدا -->
            <div class="card vtt-card">
                <div class="card-header">
                    <span class="vtt-card-icon"><i class="ri-mic-2-line"></i></span>
                    <div>
                        <h5 class="vtt-card-heading">ضبط صدا</h5>
                        <p class="vtt-card-sub">مستقیماً با میکروفن سیستم ضبط کنید</p>
                    </div>
                </div>

                <div class="card-body">
                    <div class="vtt-recorder">
                        <div class="vtt-pulse">
                            <span class="vtt-pulse-core"><i class="ri-mic-fill"></i></span>
                        </div>

                        <div id="recording-time" class="vtt-timer">00:00</div>

                        <div id="recording-status" class="badge bg-light text-dark">آماده برای ضبط</div>

                        <div class="vtt-rec-buttons">
                            <button id="start-recording" class="btn btn-primary">
                                <i class="ri-mic-fill"></i> شروع ضبط
                            </button>
                            <button id="stop-recording" class="btn btn-danger" disabled>
                                <i class="ri-stop-fill"></i> توقف ضبط
                            </button>
                        </div>
                    </div>

                    <div id="audio-container" class="vtt-preview d-none">
                        <label class="vtt-label"><i class="ri-headphone-line"></i> پیش‌نمایش صدا</label>
                        <audio id="recorded-audio" controls></audio>

                        <label for="filename" class="vtt-label"><i class="ri-file-text-line"></i> نام فایل</label>
                        <input type="text" id="filename" class="form-control" placeholder="نام فایل را وارد کنید" required>

                        <div class="d-flex justify-content-end mt-3">
                            <button id="upload-audio" class="btn btn-success">
                                <i class="ri-upload-2-fill"></i> آپلود صدا
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- فایل های صوتی -->
            <div class="card vtt-card">
                <div class="card-header">
                    <span class="vtt-card-icon"><i class="ri-folder-music-line"></i></span>
                    <div>
                        <h5 class="vtt-card-heading">تولید متن از فایل صوتی</h5>
                        <p class="vtt-card-sub">یک فایل را انتخاب کنید تا به متن تبدیل شود</p>
                    </div>
                </div>

                <div class="card-body">
                    <h6 class="vtt-section-title"><i class="ri-upload-cloud-2-line"></i> آپلود فایل صوتی</h6>
                    <input type="file" class="filepond" name="voices" id="voices" data-allow-reorder="true"
                           data-max-file-size="24MB" data-max-files="1" required>

                    <hr class="my-4">

                    <h6 class="vtt-section-title"><i class="ri-play-list-line"></i> فایل های صوتی موجود در سیستم</h6>

                    <form id="voiceForm" action="/submit" method="post">
                        <div class="vtt-files">
                            <label th:each="voice : ${voiceList}" class="vtt-file">
                                <input class="form-check-input" name="exampleRadios" type="radio"
                                       th:value="${voice.fileName}">
                                <span class="vtt-file-icon"><i class="ri-file-music-line"></i></span>
                                <span class="vtt-file-text">
                                    <span th:text="${voice.getFileName()}" class="file-name-text"></span>
                                    <span class="vtt-file-size" th:text="${voice.getFileSize()} + ' مگابایت'"></span>
                                </span>
                                <span class="vtt-file-actions">
                                    <button type="button" class="btn btn-soft-success play-button" title="پخش"
                                            th:data-filename="${voice.getFileName()}">
                                        <i class="ri-play-fill"></i>
                                    </button>
                                    <button type="button" class="btn btn-soft-danger delete-button" title="حذف"
                                            th:data-filename="${voice.getFileName()}">
                                        <i class="ri-delete-bin-5-line"></i>
                                    </button>
                                </span>
                            </label>
                        </div>

                        <div class="vtt-files-empty" th:if="${#lists.isEmpty(voiceList)}">
                            <i class="ri-inbox-unarchive-line"></i>
                            هنوز فایل صوتی آپلود نشده است.
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary vtt-submit">
                                <i class="ri-magic-line"></i> تولید متن
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ======================= ستون چپ: خروجی متن ======================== -->
        <div class="col-xl-7">
            <div class="card vtt-card">
                <div class="card-header">
                    <span class="vtt-card-icon"><i class="ri-file-list-3-line"></i></span>
                    <div>
                        <h5 class="vtt-card-heading">متن تولید شده</h5>
                        <p class="vtt-card-sub">خروجی تبدیل صدا به متن — قابل ویرایش</p>
                    </div>
                    <div class="vtt-card-tools">
                        <!-- text-only: voice-to-text.js rewrites this button's textContent -->
                        <button id="copyButton" class="btn btn-soft-primary">کپی کردن متن</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="vtt-editor">
                        <textarea rows="30" id="outcome"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="modal">
    <div class="modal fade" id="audioModal" tabindex="-1" aria-labelledby="audioModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="audioModalLabel">پخش فایل صوتی</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="vtt-modal-file">
                        <i class="ri-file-music-line"></i>
                        <p id="audio-filename"></p>
                    </div>
                    <audio id="audio-player" controls></audio>
                </div>
            </div>
        </div>
    </div>

</th:block>


<th:block layout:fragment="pagejs">
    <script src="/assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="/assets/js/pages/sweetalerts.init.js"></script>
    <script src="/assets/libs/prismjs/prism.js"></script>
    <script src="/assets/libs/filepond/filepond.min.js"></script>
    <script src="/assets/libs/filepond-plugin-image-preview/filepond-plugin-image-preview.min.js"></script>
    <script src="/assets/libs/filepond-plugin-file-validate-size/filepond-plugin-file-validate-size.min.js"></script>
    <script src="/assets/libs/filepond-plugin-image-exif-orientation/filepond-plugin-image-exif-orientation.min.js"></script>
    <script src="/assets/libs/filepond-plugin-file-encode/filepond-plugin-file-encode.min.js"></script>
    <script src="/assets/libs/ckeditor/ckeditor.js"></script>
    <script src="/assets/js/crawler/voice-to-text.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var success = [[${success}]];
        var error = [[${error}]];

        if (success === true) {
            Swal.fire({
                text: "فایل شما با موفقیت ذخیره شد.",
                icon: "success",
                confirmButtonText: "تایید",
                confirmButtonColor: "#556ee6"
            });
        } else if (error) {
            Swal.fire({
                text: [[${error}]],
                icon: "error",
                confirmButtonText: "تایید",
                confirmButtonColor: "#d33"
            });
        }
        /*]]>*/
    </script>
</th:block>
</body>

</html>
